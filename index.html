<script>const MISSIONS=[{"id":"glasshouse","number":1,"name":"Operation Glasshouse","difficulty":"Intermediate","minutes":3,"accent":"#127b72","scene":"glass","tagline":"Your first clearance. Five small tests. One clean extraction.","briefing":"A training case has been sealed inside the Glasshouse annex. Recover five code digits from the academy’s practice stations.","defaultCode":"48263","puzzles":[{"type":"text","title":"Two receipts, one purchase","tag":"Simultaneous prices","brief":"The same pass and map prices apply to both receipts.","task":"You pay RM100 for three passes and two maps. What change is due?","answer":"39","solution":"Let pass=p and map=m. 2p+3m=64 and 4p+m=58 give p=11, m=14. Three passes and two maps cost 61, so the change is RM39.","hints":["Treat each receipt as an equation using the same two prices.","Eliminate one item price before calculating the new purchase."],"input":"numeric","evidence":[{"kind":"table","label":"Receipts","headers":["Receipt","Passes","Maps","Total"],"rows":[["A","2","3","RM64"],["B","4","1","RM58"]]}],"id":"glasshouse-1","ms":{"title":"Dua resit, satu pembelian","brief":"Harga pas dan peta adalah sama bagi kedua-dua resit.","task":"Anda membayar RM100 untuk tiga pas dan dua peta. Berapakah wang baki anda?","solution":"Ambil pas=p dan peta=m. 2p+3m=64 dan 4p+m=58 memberikan p=11, m=14. Tiga pas dan dua peta berharga RM61, jadi bakinya RM39.","hints":["Jadikan setiap resit satu persamaan menggunakan dua harga yang sama.","Hapuskan satu pemboleh ubah harga sebelum mengira pembelian baharu."],"tag":"Harga serentak"}},{"type":"text","title":"The position filter","tag":"Pattern inference","brief":"The device keeps a fixed set of character positions, in input order.","task":"Use its test log to encode ESCAPE. Enter the resulting letters.","answer":"ECP","solution":"Both tests retain positions 1, 3 and 5. ESCAPE gives E, C, P.","hints":["Compare the positions of retained letters in both test words.","The retained positions are consistent even though the test words have different lengths."],"evidence":[{"kind":"table","label":"Filter tests","headers":["Input","Output"],"rows":[["RAVEN","RVN"],["ROCKET","RCE"]]},{"kind":"code","label":"New input","value":"ESCAPE"}],"id":"glasshouse-2","ms":{"title":"Penapis kedudukan","brief":"Peranti mengekalkan kedudukan aksara tertentu mengikut urutan input.","task":"Gunakan log ujian untuk mengekod ESCAPE. Masukkan huruf yang terhasil.","solution":"Kedua-dua ujian mengekalkan kedudukan 1, 3 dan 5. ESCAPE menghasilkan E, C, P.","hints":["Bandingkan kedudukan huruf yang dikekalkan dalam kedua-dua perkataan ujian.","Kedudukan yang dikekalkan tetap sama walaupun panjang perkataan ujian berbeza."],"tag":"Mengenal pasti pola"},"answerNote":{"en":"Use the original English letters or code tokens shown in the evidence.","ms":"Gunakan huruf Inggeris asal atau token kod yang dipaparkan dalam bukti."}},{"type":"memory","title":"Reverse clearance","tag":"Transformed signal","brief":"The academy’s return channel runs backwards.","task":"Return the flashes in REVERSE order. Watch the signal, then enter your response.","answer":[4,2,4,1,3],"solution":"Original signal: 3 → 1 → 4 → 2 → 4. Required response: 4 → 2 → 4 → 1 → 3.","hints":["The requested response is a transformation of the flashes, not necessarily a direct copy.","Write the flash positions mentally, then apply the response rule. Replay is available."],"steps":[3,1,4,2,4],"id":"glasshouse-3","ms":{"title":"Pelepasan terbalik","brief":"Saluran balas akademi berjalan secara terbalik.","task":"Balas kelipan dalam urutan TERBALIK. Perhatikan isyarat, kemudian masukkan balasan anda.","solution":"Isyarat asal: 3 → 1 → 4 → 2 → 4. Balasan yang diperlukan: 4 → 2 → 4 → 1 → 3.","hints":["Balasan yang diminta ialah perubahan pada urutan kelipan, bukan semestinya salinan terus.","Ingat kedudukan kelipan, kemudian gunakan peraturan balasan. Anda boleh menonton semula."],"tag":"Isyarat yang diubah"}},{"type":"maze","title":"Intel before exit","tag":"Route planning","brief":"Two files must be recovered from the service wing.","task":"Collect A → B in that order, then reach EXIT within 56 moves. Crossing a later marker does not collect it early. Resetting clears this route, not your other modules.","answer":["E","E","S","S","S","S","S","S","E","E","E","E","N","N","N","N","W","W","N","N","E","E","W","W","S","S","E","E","S","S","S","S","W","W","W","W","W","W","N","N","N","N","S","S","S","S","E","E","E","E","E","E"],"solution":"The shortest valid route is 52 moves. One valid route: E, E, S, S, S, S, S, S, E, E, E, E, N, N, N, N, W, W, N, N, E, E, W, W, S, S, E, E, S, S, S, S, W, W, W, W, W, W, N, N, N, N, S, S, S, S, E, E, E, E, E, E. N=up, E=right, S=down, W=left.","hints":["Plan the entire ordered trip, including any necessary return from a dead end.","A shortest valid route uses 52 moves. Visit the intel markers in order before committing to the exit."],"grid":["S..#..A","##.#.##","B#.#...",".#.#.#.",".#.#.#.",".#.###.","......E"],"checkpoints":["A","B"],"moveLimit":56,"id":"glasshouse-4","ms":{"title":"Maklumat sebelum keluar","brief":"Dua fail perlu diambil dari sayap perkhidmatan.","task":"Kumpulkan A → B mengikut urutan itu, kemudian tiba di EXIT dalam 56 langkah. Melintasi penanda yang lebih lewat tidak mengutipnya lebih awal. Tetapan semula memadam laluan ini sahaja, bukan modul lain.","solution":"Laluan sah terpendek ialah 52 langkah. Satu laluan sah: E, E, S, S, S, S, S, S, E, E, E, E, N, N, N, N, W, W, N, N, E, E, W, W, S, S, E, E, S, S, S, S, W, W, W, W, W, W, N, N, N, N, S, S, S, S, E, E, E, E, E, E. N=atas, E=kanan, S=bawah, W=kiri.","hints":["Rancang keseluruhan perjalanan mengikut urutan, termasuk berpatah balik dari jalan buntu jika perlu.","Laluan sah terpendek menggunakan 52 langkah. Lawati penanda maklumat mengikut urutan sebelum menuju ke pintu keluar."],"tag":"Perancangan laluan"}},{"type":"pairs","title":"The unprinted locker rule","tag":"Rule inference","brief":"The badge-to-locker rule is linear and unchanged between recruits.","task":"Infer the rule from the calibration log, then connect each recruit to a locker.","answer":{"ada":"l8","bo":"l17","cy":"l23"},"solution":"A badge increase of 3 raises the locker by 9, so locker=3×badge+2. Ada→8, Bo→17, Cy→23.","hints":["Compare the change in badge number with the change in locker number.","After finding the constant step, check whether there is also a fixed offset."],"evidence":[{"kind":"table","label":"Calibration","headers":["Badge","Locker"],"rows":[["1","5"],["4","14"]]}],"left":[{"id":"ada","label":"ADA","detail":"Badge 2"},{"id":"bo","label":"BO","detail":"Badge 5"},{"id":"cy","label":"CY","detail":"Badge 7"}],"right":[{"id":"l23","label":"Locker 23","detail":""},{"id":"l8","label":"Locker 8","detail":""},{"id":"l17","label":"Locker 17","detail":""}],"id":"glasshouse-5","ms":{"title":"Peraturan loker yang tidak dicetak","brief":"Hubungan nombor lencana dengan loker adalah linear dan sama untuk semua rekrut.","task":"Tentukan peraturan daripada log penentukuran, kemudian padankan setiap rekrut dengan loker.","solution":"Apabila nombor lencana bertambah 3, nombor loker bertambah 9. Maka loker=3×lencana+2. Ada→8, Bo→17, Cy→23.","hints":["Bandingkan perubahan nombor lencana dengan perubahan nombor loker.","Selepas menemukan pertambahan tetap, semak sama ada terdapat juga nilai tambahan tetap."],"tag":"Mengenal pasti peraturan"}}],"edition":"Harder","ms":{"name":"Operasi Glasshouse","tagline":"Pelepasan pertama anda. Lima ujian ringkas. Satu pengekstrakan yang lancar.","briefing":"Sebuah peranti latihan telah dikunci di bangunan tambahan Glasshouse. Dapatkan lima digit kod daripada stesen latihan akademi."},"overview":{"en":"Maths, patterns, signal memory, a maze and matching.","ms":"Matematik, pola, ingatan isyarat, labirin dan padanan."}},{"id":"paper-trail","number":2,"name":"Operation Paper Trail","difficulty":"Intermediate","minutes":4,"accent":"#b85a2b","scene":"paper","tagline":"The smallest detail can undo the biggest cover story.","briefing":"A courier left behind a stack of ordinary paperwork. Find the message hidden in the records and recover the case code.","defaultCode":"73915","puzzles":[{"type":"text","title":"Route in the dispatch log","tag":"Cross-reference","brief":"The courier hid a route identifier in five dispatched codewords.","task":"Recover the identifier using the recovered header.","answer":"NORTH","solution":"Sort by time and take letter III (3) from each codeword: CANAL→N, FROST→O, CARGO→R, HOTEL→T, ASHEN→H. The identifier is NORTH.","hints":["The header specifies both an ordering field and an extraction position.","III is a Roman numeral; apply that letter position after putting the dispatches in order."],"evidence":[{"kind":"code","label":"Recovered header","value":"SEQUENCE: TIME / EXTRACT: LETTER III"},{"kind":"table","label":"Dispatches","headers":["Time","Codeword"],"rows":[["09:17","FROST"],["09:41","ASHEN"],["09:08","CANAL"],["09:33","HOTEL"],["09:24","CARGO"]]}],"id":"paper-trail-1","ms":{"title":"Laluan dalam log penghantaran","brief":"Penghantar menyembunyikan pengecam laluan dalam lima kata kod yang dihantar.","task":"Dapatkan pengecam menggunakan pengepala yang ditemukan.","solution":"Susun mengikut masa dan ambil huruf III (3) daripada setiap kata kod: CANAL→N, FROST→O, CARGO→R, HOTEL→T, ASHEN→H. Pengecamnya NORTH.","hints":["Pengepala menetapkan medan susunan dan kedudukan huruf yang perlu diambil.","III ialah angka Rom. Gunakan kedudukan huruf itu selepas menyusun penghantaran."],"tag":"Rujuk silang"},"answerNote":{"en":"Use the original English letters or code tokens shown in the evidence.","ms":"Gunakan huruf Inggeris asal atau token kod yang dipaparkan dalam bukti."}},{"type":"select","title":"Four checks at the archive","tag":"Credential audit","brief":"It is 18:10. A serial B-abc has check digit c equal to the last digit of a+b.","task":"Select all currently valid BLUE-division badges: B- serial, clearance at least 3, unexpired time, and a correct check digit. Validity includes the exact expiry minute.","answer":["A","C","F"],"solution":"A, C and F pass all four checks. B and D have expired; E has the wrong prefix and a bad check. For C, 4+6=10 gives check digit 0.","hints":["A correct expiry time does not establish a valid serial.","Work through the serial arithmetic separately from clearance and expiry."],"columns":["Serial","Clearance","Expiry"],"records":[{"id":"A","label":"Badge A","detail":"B-279|4|18:45"},{"id":"B","label":"Badge B","detail":"B-358|5|17:50"},{"id":"C","label":"Badge C","detail":"B-460|3|19:00"},{"id":"D","label":"Badge D","detail":"B-594|4|18:05"},{"id":"E","label":"Badge E","detail":"R-483|5|18:40"},{"id":"F","label":"Badge F","detail":"B-684|4|19:10"}],"id":"paper-trail-2","ms":{"title":"Empat semakan di arkib","brief":"Sekarang pukul 18:10. Nombor siri B-abc mempunyai digit semak c yang sama dengan digit terakhir a+b.","task":"Pilih semua lencana divisyen BLUE yang sah sekarang: siri B-, tahap akses sekurang-kurangnya 3, belum tamat tempoh dan digit semak betul. Lencana masih sah tepat pada minit tamat tempohnya.","solution":"A, C dan F lulus keempat-empat semakan. B dan D telah tamat tempoh; E mempunyai awalan dan digit semak yang salah. Bagi C, 4+6=10 memberikan digit semak 0.","hints":["Masa tamat tempoh yang sah tidak semestinya bermakna nombor siri itu sah.","Kira nombor siri secara berasingan daripada tahap akses dan masa tamat tempoh."],"tag":"Semakan kelayakan"}},{"type":"order","title":"Five unsynchronised clocks","tag":"Timeline reconstruction","brief":"Each event was recorded by a different clock. All events occurred on the same morning.","task":"Order the events from earliest to latest in REAL time.","answer":["loop","gate","switch","courier","archive"],"solution":"Actual times: loop 10:15; gate 10:17; switch 10:20; courier 10:22; archive 10:25.","hints":["A fast clock shows a time later than reality; a slow clock shows a time earlier.","Correct every clock independently before comparing the events."],"items":[{"id":"archive","label":"Archive opens","detail":"10:35 · clock 10 min fast"},{"id":"courier","label":"Courier leaves","detail":"09:22 · clock 60 min slow"},{"id":"switch","label":"Bag is switched","detail":"10:16 · clock 4 min slow"},{"id":"loop","label":"Camera loop starts","detail":"10:18 · clock 3 min fast"},{"id":"gate","label":"Gate closes","detail":"10:12 · clock 5 min slow"}],"id":"paper-trail-3","ms":{"title":"Lima jam yang tidak selaras","brief":"Setiap peristiwa direkodkan oleh jam yang berbeza. Semuanya berlaku pada pagi yang sama.","task":"Susun peristiwa daripada paling awal hingga paling lewat mengikut masa SEBENAR.","solution":"Masa sebenar: gelung kamera 10:15; pintu pagar 10:17; pertukaran beg 10:20; penghantar 10:22; arkib 10:25.","hints":["Jam cepat menunjukkan masa yang lebih lewat daripada masa sebenar; jam lambat menunjukkan masa yang lebih awal.","Betulkan setiap jam secara berasingan sebelum membandingkan peristiwa."],"tag":"Menyusun garis masa"}},{"type":"text","title":"Three imperfect transcriptions","tag":"Error correction","brief":"Each clerk copied the same seven-character credential. Each copy contains EXACTLY one wrong character.","task":"Recover the original credential.","answer":"M7Q4R2N","solution":"The only credential one character away from all three copies is M7Q4R2N. Each clerk’s error occurs in a different position.","hints":["Compare the copies one character position at a time.","A proposed original must be exactly one substitution away from every copy."],"evidence":[{"kind":"table","label":"Clerk copies","headers":["Clerk","Credential"],"rows":[["A","M7Q4R2X"],["B","M7P4R2N"],["C","M7Q4R8N"]]}],"id":"paper-trail-4","ms":{"title":"Tiga salinan tidak sempurna","brief":"Setiap kerani menyalin kod kelayakan tujuh aksara yang sama. Setiap salinan mengandungi TEPAT satu aksara yang salah.","task":"Dapatkan kod kelayakan asal.","solution":"Satu-satunya kod yang berbeza tepat satu aksara daripada ketiga-tiga salinan ialah M7Q4R2N. Kesilapan setiap kerani berada pada kedudukan berbeza.","hints":["Bandingkan salinan satu kedudukan aksara pada satu masa.","Cadangan kod asal mesti berbeza tepat satu penggantian aksara daripada setiap salinan."],"tag":"Pembetulan ralat"},"answerNote":{"en":"Use the original English letters or code tokens shown in the evidence.","ms":"Gunakan huruf Inggeris asal atau token kod yang dipaparkan dalam bukti."}},{"type":"text","title":"Two of every colour","tag":"Worst-case reasoning","brief":"A pouch contains 5 blue, 4 red and 3 green counters.","task":"Without looking or replacing counters, how many draws guarantee at least TWO counters of EACH colour?","answer":"11","solution":"The limiting case is green. You could draw all 9 non-green counters and only 1 green in the first 10 draws. The 11th guarantees a second green, and also guarantees at least two of the other colours.","hints":["Consider which colour could be delayed for the longest time.","Find the most counters you could draw while still having only one green."],"input":"numeric","id":"paper-trail-5","ms":{"title":"Dua bagi setiap warna","brief":"Sebuah kantung mengandungi 5 token biru, 4 merah dan 3 hijau.","task":"Tanpa melihat atau memasukkan semula token, berapa kali cabutan diperlukan untuk menjamin sekurang-kurangnya DUA token bagi SETIAP warna?","solution":"Hijau ialah kes penentu. Dalam 10 cabutan pertama, anda mungkin mendapat kesemua 9 token bukan hijau dan hanya 1 hijau. Cabutan ke-11 menjamin hijau kedua serta sekurang-kurangnya dua bagi warna lain.","hints":["Fikirkan warna yang boleh paling lama tidak muncul.","Cari bilangan token terbanyak yang boleh dicabut ketika anda masih mempunyai hanya satu token hijau."],"tag":"Penaakulan kes terburuk"}}],"edition":"Harder","ms":{"name":"Operasi Paper Trail","tagline":"Butiran terkecil mampu membongkar penyamaran terbesar.","briefing":"Seorang penghantar meninggalkan timbunan dokumen biasa. Cari mesej yang tersembunyi dalam rekod dan dapatkan kod peranti."},"overview":{"en":"Decode documents, check credentials, rebuild a timeline and solve logic questions.","ms":"Nyahsulit dokumen, semak kelayakan, susun garis masa dan selesaikan soalan logik."}},{"id":"signal-drift","number":3,"name":"Operation Signal Drift","difficulty":"Harder","minutes":5,"accent":"#a16816","scene":"radio","tagline":"A broken transmission. A message still worth hearing.","briefing":"A remote relay is losing its signal. Decode the broadcasts and retune the station to recover five missing digits.","defaultCode":"60528","puzzles":[{"type":"text","title":"The missing shift","tag":"Cipher inference","brief":"The transmitter uses one fixed Caesar shift.","task":"Recover the word encoded as CLJAVY.","answer":"VECTOR","solution":"The calibration shows a forward shift of 7. Undoing it gives VECTOR.","hints":["The calibration arrows describe encryption, not decryption.","Find the shift from the known pair, then move the ciphertext the opposite way."],"evidence":[{"kind":"table","label":"Calibration","headers":["Plain","Encoded"],"rows":[["A","H"],["M","T"]]},{"kind":"code","label":"Intercept","value":"CLJAVY"}],"id":"signal-drift-1","ms":{"title":"Anjakan yang hilang","brief":"Pemancar menggunakan satu anjakan Caesar yang tetap.","task":"Nyahsulit perkataan yang dikodkan sebagai CLJAVY.","solution":"Penentukuran menunjukkan anjakan 7 langkah ke hadapan. Menyongsangkannya menghasilkan VECTOR.","hints":["Anak panah penentukuran menunjukkan penyulitan, bukan penyahsulitan.","Tentukan anjakan daripada pasangan yang diketahui, kemudian anjak teks tersulit ke arah bertentangan."],"tag":"Mengenal pasti sifer"},"answerNote":{"en":"Use the original English letters or code tokens shown in the evidence.","ms":"Gunakan huruf Inggeris asal atau token kod yang dipaparkan dalam bukti."}},{"type":"text","title":"Act on the signal","tag":"Morse and arithmetic","brief":"The intercepted command is written in Morse. Spaces divide letters; / divides words.","task":"Carry out the command. Enter only the numeric result.","answer":"12","solution":"The transmission reads TRIPLE FOUR. 3×4=12.","hints":["Decode all the letters before interpreting the command.","The first decoded word tells you an operation; the second supplies its input."],"input":"numeric","evidence":[{"kind":"code","label":"Transmission","value":"- .-. .. .--. .-.. . / ..-. --- ..- .-."},{"kind":"table","label":"Codebook","headers":["Letter","Code"],"rows":[["E","."],["F","..-."],["I",".."],["L",".-.."],["O","---"],["P",".--."],["R",".-."],["T","-"],["U","..-"]]}],"id":"signal-drift-2","ms":{"title":"Bertindak mengikut isyarat","brief":"Arahan yang dipintas ditulis dalam kod Morse. Ruang memisahkan huruf; / memisahkan perkataan.","task":"Laksanakan arahan itu. Masukkan hasil dalam nombor sahaja.","solution":"Transmisi berbunyi TRIPLE FOUR, iaitu tiga kali empat. 3×4=12.","hints":["Nyahsulit semua huruf sebelum mentafsir arahan.","Perkataan pertama yang dinyahsulit menetapkan operasi; perkataan kedua memberikan nilainya."],"tag":"Morse dan aritmetik"}},{"type":"memory","title":"Rotate the burst","tag":"Transformed signal","brief":"The relay has shifted the packet boundary by one flash.","task":"Start your response with the SECOND flash; place the first flash last. Watch the signal, then enter your response.","answer":[1,3,2,4,2,4],"solution":"Original signal: 4 → 1 → 3 → 2 → 4 → 2. Required response: 1 → 3 → 2 → 4 → 2 → 4.","hints":["The requested response is a transformation of the flashes, not necessarily a direct copy.","Write the flash positions mentally, then apply the response rule. Replay is available."],"steps":[4,1,3,2,4,2],"id":"signal-drift-3","ms":{"title":"Putarkan urutan isyarat","brief":"Geganti telah mengalihkan sempadan paket sebanyak satu kelipan.","task":"Mulakan balasan dengan kelipan KEDUA; letakkan kelipan pertama di akhir. Perhatikan isyarat, kemudian masukkan balasan anda.","solution":"Isyarat asal: 4 → 1 → 3 → 2 → 4 → 2. Balasan yang diperlukan: 1 → 3 → 2 → 4 → 2 → 4.","hints":["Balasan yang diminta ialah perubahan pada urutan kelipan, bukan semestinya salinan terus.","Ingat kedudukan kelipan, kemudian gunakan peraturan balasan. Anda boleh menonton semula."],"tag":"Isyarat yang diubah"}},{"type":"dials","title":"Coupled frequencies","tag":"Algebra","brief":"The three settings are whole numbers from 0 to 9.","task":"Set all channels so A+B=11, B+C=9, and A+2C=14.","answer":[6,5,4],"solution":"Subtracting the first two equations gives A−C=2. Combined with A+2C=14, C=4, A=6 and B=5.","hints":["Compare the first two equations to eliminate B.","Once A is written in terms of C, use the third equation."],"labels":["Channel A","Channel B","Channel C"],"id":"signal-drift-4","ms":{"title":"Frekuensi bergandingan","brief":"Ketiga-tiga tetapan ialah nombor bulat daripada 0 hingga 9.","task":"Tetapkan semua saluran supaya A+B=11, B+C=9 dan A+2C=14.","solution":"Tolak persamaan kedua daripada yang pertama untuk mendapatkan A−C=2. Gabungkan dengan A+2C=14: C=4, A=6 dan B=5.","hints":["Bandingkan dua persamaan pertama untuk menghapuskan B.","Selepas menulis A dalam sebutan C, gunakan persamaan ketiga."],"tag":"Algebra"}},{"type":"text","title":"Locate the flipped bit","tag":"Parity deduction","brief":"Before damage, every row and every column contained an EVEN number of 1s. Exactly one bit flipped.","task":"Which cell is damaged? Enter its location as R2C3, for example.","answer":"R2C3","solution":"Row 2 has odd parity, and column 3 has odd parity. Their intersection is R2C3.","hints":["Audit the rows and columns independently.","A single flipped bit changes parity in exactly one row and one column."],"aliases":["23"],"evidence":[{"kind":"table","label":"Received grid","headers":["Row / column","1","2","3"],"rows":[["1","1","0","1"],["2","0","1","0"],["3","1","1","0"]]}],"id":"signal-drift-5","ms":{"title":"Cari bit yang berubah","brief":"Sebelum kerosakan, setiap baris dan lajur mengandungi bilangan angka 1 yang GENAP. Tepat satu bit telah berubah.","task":"Sel manakah yang rosak? Masukkan lokasinya dalam format seperti R2C3.","solution":"Baris 2 mempunyai pariti ganjil, begitu juga lajur 3. Persilangannya ialah R2C3.","hints":["Semak baris dan lajur secara berasingan.","Satu bit yang berubah menukar pariti tepat satu baris dan satu lajur."],"tag":"Deduksi pariti"},"answerNote":{"en":"Use the original English letters or code tokens shown in the evidence.","ms":"Gunakan huruf Inggeris asal atau token kod yang dipaparkan dalam bukti."}}],"edition":"Harder","ms":{"name":"Operasi Signal Drift","tagline":"Transmisi terganggu. Mesejnya masih perlu didengar.","briefing":"Sebuah geganti terpencil sedang kehilangan isyarat. Nyahsulit siaran dan tala semula stesen untuk mendapatkan lima digit yang hilang."},"overview":{"en":"Crack ciphers, interpret Morse, remember signals and tune the channels.","ms":"Pecahkan sifer, tafsir kod Morse, ingat isyarat dan tala saluran."}},{"id":"midnight-express","number":4,"name":"Operation Midnight Express","difficulty":"Harder","minutes":6,"accent":"#354f9c","scene":"rail","tagline":"The last train won’t wait for an unfinished mission.","briefing":"A sealed case is travelling on the night train. Rebuild the passenger trail before it reaches the next station.","defaultCode":"19476","puzzles":[{"type":"text","title":"Two clocks before midnight","tag":"Time reconstruction","brief":"Your watch reads 23:47 and is 3 minutes slow. The platform clock is 4 minutes fast.","task":"Boarding ends when the platform clock shows 00:12. A 7-minute walk and 5-minute check remain. If you leave now, how many minutes will you have to spare?","answer":"6","solution":"Real time is 23:50. Boarding ends at real 00:08, leaving 18 minutes. The walk and check use 12 minutes, so 6 remain.","hints":["Put both clocks onto real time before calculating the interval.","The journey and check are separate costs within the remaining interval."],"input":"numeric","id":"midnight-express-1","ms":{"title":"Dua jam sebelum tengah malam","brief":"Jam tangan anda menunjukkan 23:47 dan lambat 3 minit. Jam di platform cepat 4 minit.","task":"Pintu masuk ditutup apabila jam platform menunjukkan 00:12. Anda masih perlu berjalan 7 minit dan melalui pemeriksaan 5 minit. Jika bertolak sekarang, berapa minit baki masa anda?","solution":"Masa sebenar ialah 23:50. Pintu masuk ditutup pada masa sebenar 00:08, iaitu 18 minit lagi. Berjalan dan pemeriksaan mengambil 12 minit, maka bakinya 6 minit.","hints":["Tukarkan kedua-dua jam kepada masa sebenar sebelum mengira tempoh.","Perjalanan dan pemeriksaan ialah dua penggunaan masa yang berasingan dalam tempoh yang tinggal."],"tag":"Menentukan masa sebenar"}},{"type":"maze","title":"The carriage retrieval","tag":"Route planning","brief":"Two sealed files are in different service compartments.","task":"Collect A → B in that order, then reach EXIT within 64 moves. Crossing a later marker does not collect it early. Resetting clears this route, not your other modules.","answer":["S","S","E","E","S","S","W","W","S","S","E","E","E","E","N","N","N","N","N","N","W","W","E","E","S","S","S","S","S","S","W","W","W","W","N","N","E","E","N","S","W","W","S","S","E","E","E","E","N","N","N","N","N","N","E","E","S","S","S","S","S","S"],"solution":"The shortest valid route is 62 moves. One valid route: S, S, E, E, S, S, W, W, S, S, E, E, E, E, N, N, N, N, N, N, W, W, E, E, S, S, S, S, S, S, W, W, W, W, N, N, E, E, N, S, W, W, S, S, E, E, E, E, N, N, N, N, N, N, E, E, S, S, S, S, S, S. N=up, E=right, S=down, W=left.","hints":["Plan the entire ordered trip, including any necessary return from a dead end.","A shortest valid route uses 62 moves. Visit the intel markers in order before committing to the exit."],"grid":["S#A....",".###.#.","...#.#.","##B#.#.","...#.#.",".###.#.",".....#E"],"checkpoints":["A","B"],"moveLimit":64,"id":"midnight-express-2","ms":{"title":"Pengambilan dalam gerabak","brief":"Dua fail berkedap berada dalam ruang perkhidmatan yang berlainan.","task":"Kumpulkan A → B mengikut urutan itu, kemudian tiba di EXIT dalam 64 langkah. Melintasi penanda yang lebih lewat tidak mengutipnya lebih awal. Tetapan semula memadam laluan ini sahaja, bukan modul lain.","solution":"Laluan sah terpendek ialah 62 langkah. Satu laluan sah: S, S, E, E, S, S, W, W, S, S, E, E, E, E, N, N, N, N, N, N, W, W, E, E, S, S, S, S, S, S, W, W, W, W, N, N, E, E, N, S, W, W, S, S, E, E, E, E, N, N, N, N, N, N, E, E, S, S, S, S, S, S. N=atas, E=kanan, S=bawah, W=kiri.","hints":["Rancang keseluruhan perjalanan mengikut urutan, termasuk berpatah balik dari jalan buntu jika perlu.","Laluan sah terpendek menggunakan 62 langkah. Lawati penanda maklumat mengikut urutan sebelum menuju ke pintu keluar."],"tag":"Perancangan laluan"}},{"type":"order","title":"Five departure slots","tag":"Positional deduction","brief":"WREN, LYNX, IBIS, KITE and ROOK leave in five consecutive slots, with no ties.","task":"Order the departures. IBIS is immediately after LYNX. KITE is exactly three slots after WREN. ROOK is before WREN.","answer":["rook","wren","lynx","ibis","kite"],"solution":"WREN cannot occupy slot 1 because ROOK precedes it. The three-slot gap forces WREN into slot 2 and KITE into 5. ROOK is 1; LYNX and IBIS fill 3 and 4.","hints":["The three-slot separation strongly limits where WREN can be placed.","Combine that separation with the requirement for a train before WREN."],"items":[{"id":"ibis","label":"IBIS","detail":""},{"id":"kite","label":"KITE","detail":""},{"id":"wren","label":"WREN","detail":""},{"id":"rook","label":"ROOK","detail":""},{"id":"lynx","label":"LYNX","detail":""}],"id":"midnight-express-3","ms":{"title":"Lima slot pelepasan","brief":"WREN, LYNX, IBIS, KITE dan ROOK berlepas dalam lima slot berturutan, tanpa berkongsi slot.","task":"Susun pelepasan. IBIS betul-betul selepas LYNX. KITE tepat tiga slot selepas WREN. ROOK sebelum WREN.","solution":"WREN tidak boleh berada di slot 1 kerana ROOK mendahuluinya. Jarak tiga slot memaksa WREN di slot 2 dan KITE di slot 5. ROOK di slot 1; LYNX dan IBIS mengisi slot 3 dan 4.","hints":["Jarak tiga slot sangat mengehadkan kedudukan WREN.","Gabungkan jarak itu dengan syarat bahawa ada kereta api yang berlepas sebelum WREN."],"tag":"Deduksi kedudukan"}},{"type":"text","title":"Five seats, no spare clue","tag":"Seating deduction","brief":"Mira, Noor, Remy, Sora and Taj occupy seats 1–5, one person each. Higher seat numbers are to the right.","task":"Noor is immediately right of Mira. Remy is two seats left of Mira. Sora is somewhere right of Noor. Which seat holds Taj?","answer":"2","solution":"Mira must be in 3: lower positions cannot fit Remy, and higher positions leave no seat for Sora. Then Remy=1, Noor=4, Sora=5 and Taj=2.","hints":["Test the possible positions of Mira without assigning anyone else arbitrarily.","Both the two-seat gap on the left and the room needed on the right must fit."],"input":"numeric","id":"midnight-express-4","ms":{"title":"Lima tempat duduk","brief":"Mira, Noor, Remy, Sora dan Taj masing-masing menduduki tempat 1–5. Nombor tempat duduk meningkat ke kanan.","task":"Noor betul-betul di kanan Mira. Remy dua tempat di kiri Mira. Sora di suatu tempat di kanan Noor. Di tempat nombor berapakah Taj duduk?","solution":"Mira mesti di tempat 3: kedudukan lebih rendah tidak memuatkan Remy, manakala kedudukan lebih tinggi tidak meninggalkan ruang untuk Sora. Maka Remy=1, Noor=4, Sora=5 dan Taj=2.","hints":["Uji kemungkinan kedudukan Mira tanpa meletakkan orang lain secara rambang.","Jarak dua tempat di kiri dan ruang yang diperlukan di kanan mesti mencukupi."],"tag":"Deduksi tempat duduk"}},{"type":"text","title":"The moving hour hand","tag":"Clock geometry","brief":"A working analogue clock reads 03:20.","task":"What is the SMALLER angle between its hour and minute hands, in degrees?","answer":"20","solution":"The minute hand is at 120°. The hour hand has advanced to 100°. The smaller difference is 20°.","hints":["The hour hand does not remain fixed at the 3 while minutes pass.","An hour hand moves 0.5° per minute; the minute hand moves 6° per minute."],"input":"numeric","id":"midnight-express-5","ms":{"title":"Jarum jam yang bergerak","brief":"Sebuah jam analog yang berfungsi menunjukkan 03:20.","task":"Berapakah sudut yang LEBIH KECIL antara jarum jam dengan jarum minit, dalam darjah?","solution":"Jarum minit berada pada 120°. Jarum jam telah bergerak ke 100°. Perbezaan yang lebih kecil ialah 20°.","hints":["Jarum jam tidak kekal tepat pada angka 3 apabila minit berlalu.","Jarum jam bergerak 0.5° seminit; jarum minit bergerak 6° seminit."],"tag":"Geometri jam"}}],"edition":"Harder","ms":{"name":"Operasi Midnight Express","tagline":"Kereta api terakhir tidak akan menunggu misi yang belum selesai.","briefing":"Sebuah peranti berkunci sedang dibawa dengan kereta api malam. Bina semula jejak penumpang sebelum ia tiba di stesen seterusnya."},"overview":{"en":"Beat the night train with clock puzzles, a maze and deduction challenges.","ms":"Dahului kereta api malam dengan teka-teki jam, labirin dan cabaran deduksi."}},{"id":"mirror-room","number":5,"name":"Operation Mirror Room","difficulty":"Intermediate","minutes":4,"accent":"#8650a5","scene":"mirror","tagline":"Nothing is quite as it first appears.","briefing":"The reflection suite is full of lookalikes, reversed notes and mismatched labels. Identify the genuine evidence.","defaultCode":"85032","puzzles":[{"type":"text","title":"Reverse the machine","tag":"Two-stage cipher","brief":"The machine encrypted a word using the configuration below.","task":"Recover the original word from UDFMGFS.","answer":"REFLECT","solution":"Undo reversal first: SFGMFDU. Shift those letters back by one to obtain REFLECT.","hints":["Decryption undoes the operations in the opposite order.","The reversal must be undone before the alphabet shift."],"evidence":[{"kind":"lines","label":"Encryption configuration","lines":["1. Shift each letter one place forward: A→B, Z→A.","2. Reverse the entire result."]},{"kind":"code","label":"Output","value":"UDFMGFS"}],"id":"mirror-room-1","ms":{"title":"Songsangkan mesin","brief":"Mesin menyulitkan satu perkataan menggunakan tetapan di bawah.","task":"Dapatkan perkataan asal daripada UDFMGFS.","solution":"Songsangkan pembalikan dahulu: SFGMFDU. Anjak huruf itu satu langkah ke belakang untuk mendapatkan REFLECT.","hints":["Penyahsulitan membatalkan operasi mengikut urutan yang bertentangan.","Pembalikan perlu dibatalkan sebelum anjakan abjad."],"tag":"Sifir dua peringkat"},"answerNote":{"en":"Use the original English letters or code tokens shown in the evidence.","ms":"Gunakan huruf Inggeris asal atau token kod yang dipaparkan dalam bukti."}},{"type":"text","title":"A number that reflects","tag":"Number riddle","brief":"A three-digit number reads the same forwards and backwards.","task":"Its digits sum to 13. Each outside digit is 2 greater than the middle digit. What is the number?","answer":"535","solution":"Let the middle digit be b, so each outside digit is b+2. 3b+4=13 gives b=3 and the number 535.","hints":["The outside digits must match each other.","Represent the middle digit with a variable before using the digit sum."],"input":"numeric","id":"mirror-room-2","ms":{"title":"Nombor yang bercermin","brief":"Satu nombor tiga digit dibaca sama dari hadapan dan belakang.","task":"Jumlah digitnya ialah 13. Setiap digit luar lebih besar 2 daripada digit tengah. Apakah nombor itu?","solution":"Ambil digit tengah sebagai b, jadi setiap digit luar ialah b+2. 3b+4=13 memberikan b=3 dan nombornya 535.","hints":["Kedua-dua digit luar mestilah sama.","Wakilkan digit tengah dengan pemboleh ubah sebelum menggunakan jumlah digit."],"tag":"Teka-teki nombor"}},{"type":"select","title":"Rotation or reflection?","tag":"Visual logic","brief":"A seal is read clockwise from any starting position. Rotation is allowed; reflection is not. Genuine seals use batch K7.","task":"Select every genuine seal.","answer":["A","B","E","G"],"solution":"The four allowed clockwise rotations are ▲●■◆, ●■◆▲, ■◆▲● and ◆▲●■. Only A, B, E and G also have batch K7.","hints":["Starting somewhere else on a ring preserves the clockwise neighbour order.","A reversed clockwise order is a reflection, not a rotation."],"columns":["Clockwise ring","Batch"],"evidence":[{"kind":"code","label":"Master ring, clockwise","value":"▲ ● ■ ◆"}],"records":[{"id":"A","label":"Seal A","detail":"▲ ● ■ ◆|K7"},{"id":"B","label":"Seal B","detail":"● ■ ◆ ▲|K7"},{"id":"C","label":"Seal C","detail":"▲ ◆ ■ ●|K7"},{"id":"D","label":"Seal D","detail":"■ ◆ ▲ ●|K1"},{"id":"E","label":"Seal E","detail":"◆ ▲ ● ■|K7"},{"id":"F","label":"Seal F","detail":"▲ ■ ● ◆|K7"},{"id":"G","label":"Seal G","detail":"■ ◆ ▲ ●|K7"},{"id":"H","label":"Seal H","detail":"● ▲ ◆ ■|K7"}],"id":"mirror-room-3","ms":{"title":"Putaran atau pantulan?","brief":"Meterai dibaca mengikut arah jam bermula dari mana-mana kedudukan. Putaran dibenarkan; pantulan tidak. Meterai tulen menggunakan kelompok K7.","task":"Pilih semua meterai tulen.","solution":"Empat putaran arah jam yang dibenarkan ialah ▲●■◆, ●■◆▲, ■◆▲● dan ◆▲●■. Hanya A, B, E dan G turut mempunyai kelompok K7.","hints":["Bermula pada kedudukan lain pada gelang mengekalkan susunan jiran mengikut arah jam.","Susunan arah jam yang diterbalikkan ialah pantulan, bukan putaran."],"tag":"Logik visual"}},{"type":"pairs","title":"Mirrored address routing","tag":"Two-step matching","brief":"Each port address is the reversed three-digit badge number, plus 27.","task":"Connect each badge to its destination port.","answer":{"a":"p839","b":"p331","c":"p302"},"solution":"218→812+27=839. 403→304+27=331. 572→275+27=302.","hints":["Reversing digits is different from sorting them.","Apply the addition only after reconstructing the reversed number."],"left":[{"id":"a","label":"Badge 218","detail":""},{"id":"b","label":"Badge 403","detail":""},{"id":"c","label":"Badge 572","detail":""}],"right":[{"id":"p302","label":"Port 302","detail":""},{"id":"p839","label":"Port 839","detail":""},{"id":"p331","label":"Port 331","detail":""}],"id":"mirror-room-4","ms":{"title":"Penghalaan alamat bercermin","brief":"Setiap alamat port ialah nombor lencana tiga digit yang diterbalikkan, kemudian ditambah 27.","task":"Padankan setiap lencana dengan port destinasinya.","solution":"218→812+27=839. 403→304+27=331. 572→275+27=302.","hints":["Menterbalikkan digit berbeza daripada menyusunnya.","Lakukan penambahan hanya selepas membina nombor terbalik."],"tag":"Padanan dua langkah"}},{"type":"order","title":"What fits inside?","tag":"Area reasoning","brief":"Every sleeve has a 1 cm unusable border on ALL four sides. Dimensions shown are outside measurements.","task":"File the sleeves by usable interior area, smallest first.","answer":["b","d","c","a"],"solution":"Usable areas are A:10×5=50, B:11×4=44, C:8×6=48, D:9×5=45 cm². Order B, D, C, A.","hints":["A border on both sides reduces each dimension twice.","Calculate the interior dimensions before multiplying length by width."],"items":[{"id":"c","label":"Sleeve C","detail":"10 cm × 8 cm"},{"id":"a","label":"Sleeve A","detail":"12 cm × 7 cm"},{"id":"d","label":"Sleeve D","detail":"11 cm × 7 cm"},{"id":"b","label":"Sleeve B","detail":"13 cm × 6 cm"}],"id":"mirror-room-5","ms":{"title":"Apa yang muat di dalam?","brief":"Setiap sarung mempunyai sempadan tidak boleh guna selebar 1 cm pada KEEMPAT-EMPAT sisinya. Ukuran yang ditunjukkan ialah ukuran luar.","task":"Susun sarung mengikut luas dalaman yang boleh digunakan, bermula dengan yang paling kecil.","solution":"Luas boleh guna ialah A:10×5=50, B:11×4=44, C:8×6=48, D:9×5=45 cm². Urutan B, D, C, A.","hints":["Sempadan pada kedua-dua sisi mengurangkan setiap ukuran sebanyak dua kali lebar sempadan.","Kira ukuran dalaman sebelum mendarab panjang dengan lebar."],"tag":"Penaakulan luas"}}],"edition":"Harder","ms":{"name":"Operasi Mirror Room","tagline":"Bukan semuanya seperti yang kelihatan.","briefing":"Bilik cermin dipenuhi objek seiras, nota terbalik dan label yang tersalah padan. Kenal pasti bukti yang tulen."},"overview":{"en":"Spot reflections, reverse codes and sort the genuine evidence.","ms":"Kenal pasti pantulan, songsangkan kod dan susun bukti tulen."}},{"id":"deep-freeze","number":6,"name":"Operation Deep Freeze","difficulty":"Harder","minutes":5,"accent":"#246e9e","scene":"ice","tagline":"Keep a cool head when the trail goes cold.","briefing":"The cold-store annex holds a missing research file. Read the temperature logs, decode the storage grid and recover its access code.","defaultCode":"31784","puzzles":[{"type":"text","title":"Rates, not readings","tag":"Rate arithmetic","brief":"A chamber starts at −11°C.","task":"It warms at 4°C per minute for 5 minutes, then cools at 3°C per minute for 2 minutes. What is its final temperature in °C?","answer":"3","solution":"−11+(4×5)−(3×2)=3°C.","hints":["Each rate must be applied for its full duration.","Work through the two phases in order; the starting reading is negative."],"input":"numeric","id":"deep-freeze-1","ms":{"title":"Kadar, bukan bacaan","brief":"Suhu awal sebuah ruang ialah −11°C.","task":"Suhunya meningkat 4°C seminit selama 5 minit, kemudian menurun 3°C seminit selama 2 minit. Berapakah suhu akhirnya dalam °C?","solution":"−11+(4×5)−(3×2)=3°C.","hints":["Gunakan setiap kadar sepanjang tempohnya.","Kira kedua-dua fasa mengikut urutan; bacaan awal adalah negatif."],"tag":"Pengiraan kadar"}},{"type":"text","title":"The unlabelled coordinate order","tag":"Codebook inference","brief":"Each coordinate contains one row digit and one column digit. Their order is missing from the manual.","task":"Use the calibration pairs to recover the word in the intercept.","answer":"CIPHER","solution":"Calibration establishes column-first, row-second. 22=C, 12=I, 31=P, 14=H, 41=E, 11=R.","hints":["Test both possible row/column orders against the calibration.","The table itself is labelled normally; the transmitted coordinate order is the uncertainty."],"evidence":[{"kind":"table","label":"Storage grid","headers":["Row / column","1","2","3","4"],"rows":[["1","R","O","P","E"],["2","I","C","B","X"],["3","A","D","F","G"],["4","H","J","K","L"]]},{"kind":"table","label":"Known readings","headers":["Tag","Letter"],"rows":[["21","O"],["43","G"]]},{"kind":"code","label":"Intercept","value":"22 · 12 · 31 · 14 · 41 · 11"}],"id":"deep-freeze-2","ms":{"title":"Urutan koordinat tanpa label","brief":"Setiap koordinat mengandungi satu digit baris dan satu digit lajur. Urutannya hilang daripada manual.","task":"Gunakan pasangan penentukuran untuk mendapatkan perkataan dalam mesej yang dipintas.","solution":"Penentukuran menetapkan lajur dahulu, baris kemudian. 22=C, 12=I, 31=P, 14=H, 41=E, 11=R.","hints":["Uji kedua-dua kemungkinan urutan baris/lajur menggunakan penentukuran.","Jadual dilabel seperti biasa; yang belum diketahui ialah urutan koordinat yang dihantar."],"tag":"Mengenal pasti aturan buku kod"},"answerNote":{"en":"Use the original English letters or code tokens shown in the evidence.","ms":"Gunakan huruf Inggeris asal atau token kod yang dipaparkan dalam bukti."}},{"type":"text","title":"The mixed coolant","tag":"Weighted average","brief":"Two portions of the same coolant remain liquid throughout mixing.","task":"Mix 200 ml at −6°C with 300 ml at 14°C. With no heat loss or change of state, what equilibrium temperature is reached?","answer":"6","solution":"(200×−6+300×14)/(200+300)=3000/500=6°C.","hints":["The larger portion contributes more; this is not the simple average of the two temperatures.","Use each volume as the weight of its temperature."],"input":"numeric","id":"deep-freeze-3","ms":{"title":"Campuran penyejuk","brief":"Dua bahagian cecair penyejuk yang sama kekal cecair sepanjang pencampuran.","task":"Campurkan 200 ml pada −6°C dengan 300 ml pada 14°C. Tanpa kehilangan haba atau perubahan keadaan jirim, berapakah suhu keseimbangannya?","solution":"(200×−6+300×14)/(200+300)=3000/500=6°C.","hints":["Bahagian yang lebih besar menyumbang lebih banyak; ini bukan purata mudah kedua-dua suhu.","Gunakan isipadu setiap bahagian sebagai pemberat suhunya."],"tag":"Purata berwajaran"}},{"type":"memory","title":"Return through the frost","tag":"Transformed signal","brief":"The cold-store receiver expects a reversed acknowledgement.","task":"Return the six flashes in REVERSE order. Watch the signal, then enter your response.","answer":[2,1,3,2,4,1],"solution":"Original signal: 1 → 4 → 2 → 3 → 1 → 2. Required response: 2 → 1 → 3 → 2 → 4 → 1.","hints":["The requested response is a transformation of the flashes, not necessarily a direct copy.","Write the flash positions mentally, then apply the response rule. Replay is available."],"steps":[1,4,2,3,1,2],"id":"deep-freeze-4","ms":{"title":"Balasan dalam kesejukan","brief":"Penerima stor sejuk memerlukan pengesahan dalam urutan terbalik.","task":"Balas enam kelipan dalam urutan TERBALIK. Perhatikan isyarat, kemudian masukkan balasan anda.","solution":"Isyarat asal: 1 → 4 → 2 → 3 → 1 → 2. Balasan yang diperlukan: 2 → 1 → 3 → 2 → 4 → 1.","hints":["Balasan yang diminta ialah perubahan pada urutan kelipan, bukan semestinya salinan terus.","Ingat kedudukan kelipan, kemudian gunakan peraturan balasan. Anda boleh menonton semula."],"tag":"Isyarat yang diubah"}},{"type":"pairs","title":"The miscalibrated thermometer","tag":"Calibration inference","brief":"The thermometer’s display is linearly related to true temperature.","task":"Correct each displayed reading, then find its true temperature AFTER cooling a further 3°C.","answer":{"a":"t5","b":"t9","c":"t1"},"solution":"Display=2×true+2, so true=(display−2)/2. After cooling by 3°C, readings 18,26,10 finish at 5,9,1°C.","hints":["The two calibration points reveal both a scale factor and an offset.","Remove the calibration error before applying the final cooling step."],"evidence":[{"kind":"table","label":"Calibration","headers":["True °C","Displayed"],"rows":[["0","2"],["5","12"]]}],"left":[{"id":"a","label":"Sample A","detail":"Display 18"},{"id":"b","label":"Sample B","detail":"Display 26"},{"id":"c","label":"Sample C","detail":"Display 10"}],"right":[{"id":"t9","label":"Final 9°C","detail":""},{"id":"t1","label":"Final 1°C","detail":""},{"id":"t5","label":"Final 5°C","detail":""}],"id":"deep-freeze-5","ms":{"title":"Termometer tersalah tentu ukur","brief":"Paparan termometer mempunyai hubungan linear dengan suhu sebenar.","task":"Betulkan setiap bacaan paparan, kemudian cari suhu sebenarnya SELEPAS disejukkan lagi sebanyak 3°C.","solution":"Paparan=2×suhu sebenar+2, jadi suhu sebenar=(paparan−2)/2. Selepas penyejukan 3°C, bacaan 18,26,10 berakhir pada 5,9,1°C.","hints":["Dua titik penentukuran menunjukkan faktor skala dan nilai tambahan tetap.","Betulkan ralat penentukuran sebelum menggunakan langkah penyejukan akhir."],"tag":"Mengenal pasti penentukuran"}}],"edition":"Harder","ms":{"name":"Operasi Deep Freeze","tagline":"Kekalkan ketenangan apabila jejak menjadi dingin.","briefing":"Fail penyelidikan yang hilang berada di bangunan stor sejuk. Baca log suhu, nyahsulit grid simpanan dan dapatkan kod aksesnya."},"overview":{"en":"Follow temperature clues, decode a storage grid and return a memory signal.","ms":"Ikuti petunjuk suhu, nyahsulit grid penyimpanan dan balas isyarat ingatan."}},{"id":"crosswind","number":7,"name":"Operation Crosswind","difficulty":"Harder","minutes":7,"accent":"#b05b3a","scene":"sky","tagline":"A rooftop route. A shifting view. Keep your bearings.","briefing":"A rooftop drone can carry the last piece of intelligence out of the city. Clear its flight route and verify the dispatch records.","defaultCode":"92650","puzzles":[{"type":"text","title":"Find the way home","tag":"Vector reasoning","brief":"An agent walks 8 blocks north, 6 east, 3 south and 2 west.","task":"How many blocks is the SHORTEST return to the start along north–south and east–west grid streets?","answer":"9","solution":"Net displacement is 5 north and 4 east. Returning along grid streets takes 5+4=9 blocks.","hints":["Opposite-direction parts of the route cancel in the final displacement.","You need the shortest return, not a retracing of the outward walk."],"input":"numeric","id":"crosswind-1","ms":{"title":"Cari jalan pulang","brief":"Seorang ejen berjalan 8 blok ke utara, 6 ke timur, 3 ke selatan dan 2 ke barat.","task":"Berapa blok laluan pulang TERPENDEK ke titik mula melalui jalan grid utara–selatan dan timur–barat?","solution":"Sesaran bersih ialah 5 blok ke utara dan 4 ke timur. Pulang melalui jalan grid memerlukan 5+4=9 blok.","hints":["Bahagian perjalanan yang berlawanan arah saling membatalkan dalam sesaran akhir.","Anda perlukan laluan pulang terpendek, bukan menjejaki semula seluruh perjalanan pergi."],"tag":"Penaakulan vektor"}},{"type":"maze","title":"Three rooftop caches","tag":"Route planning","brief":"The drone must gather three caches before landing at the exit.","task":"Collect A → B → C in that order, then reach EXIT within 80 moves. Crossing a later marker does not collect it early. Resetting clears this route, not your other modules.","answer":["S","S","E","E","S","S","W","W","S","S","E","E","E","E","N","N","E","E","E","E","S","S","S","S","W","W","N","N","S","S","W","W","W","W","W","W","E","E","E","E","E","E","E","E","N","N","N","N","N","N","N","N","W","W","W","W","S","S","E","E","W","W","N","N","E","E","E","E","S","S","S","S","S","S","S","S"],"solution":"The shortest valid route is 76 moves. One valid route: S, S, E, E, S, S, W, W, S, S, E, E, E, E, N, N, E, E, E, E, S, S, S, S, W, W, N, N, S, S, W, W, W, W, W, W, E, E, E, E, E, E, E, E, N, N, N, N, N, N, N, N, W, W, W, W, S, S, E, E, W, W, N, N, E, E, E, E, S, S, S, S, S, S, S, S. N=up, E=right, S=down, W=left.","hints":["Plan the entire ordered trip, including any necessary return from a dead end.","A shortest valid route uses 76 moves. Visit the intel markers in order before committing to the exit."],"grid":["S#.......",".###.###.","...#..C#.","##.#####.","...#.....",".###.###.",".....#A#.","######.#.","B.......E"],"checkpoints":["A","B","C"],"moveLimit":80,"id":"crosswind-2","ms":{"title":"Tiga simpanan di bumbung","brief":"Dron perlu mengambil tiga simpanan sebelum mendarat di pintu keluar.","task":"Kumpulkan A → B → C mengikut urutan itu, kemudian tiba di EXIT dalam 80 langkah. Melintasi penanda yang lebih lewat tidak mengutipnya lebih awal. Tetapan semula memadam laluan ini sahaja, bukan modul lain.","solution":"Laluan sah terpendek ialah 76 langkah. Satu laluan sah: S, S, E, E, S, S, W, W, S, S, E, E, E, E, N, N, E, E, E, E, S, S, S, S, W, W, N, N, S, S, W, W, W, W, W, W, E, E, E, E, E, E, E, E, N, N, N, N, N, N, N, N, W, W, W, W, S, S, E, E, W, W, N, N, E, E, E, E, S, S, S, S, S, S, S, S. N=atas, E=kanan, S=bawah, W=kiri.","hints":["Rancang keseluruhan perjalanan mengikut urutan, termasuk berpatah balik dari jalan buntu jika perlu.","Laluan sah terpendek menggunakan 76 langkah. Lawati penanda maklumat mengikut urutan sebelum menuju ke pintu keluar."],"tag":"Perancangan laluan"}},{"type":"select","title":"Can it make the round trip?","tag":"Mission arithmetic","brief":"Speed is 2 km/min. Battery drain is 10 percentage points per minute. Each mission includes a round trip and 2 minutes hovering. At least 20% battery must remain; weather must be CLEAR.","task":"The listed distance is ONE WAY. Select every flight with sufficient battery and clearance.","answer":["A","C","D","G"],"solution":"Flight time is distance+2 minutes, so required starting battery is 10×distance+40. A,C,D,G meet this and have CLEAR weather.","hints":["Account for the return leg before applying the speed.","Reserve battery is left over after flight and hovering; it is not available to spend."],"columns":["One-way distance","Battery","Weather"],"records":[{"id":"A","label":"Flight A","detail":"4 km|80%|CLEAR"},{"id":"B","label":"Flight B","detail":"5 km|85%|CLEAR"},{"id":"C","label":"Flight C","detail":"3 km|75%|CLEAR"},{"id":"D","label":"Flight D","detail":"6 km|100%|CLEAR"},{"id":"E","label":"Flight E","detail":"2 km|100%|FOG"},{"id":"F","label":"Flight F","detail":"4 km|79%|CLEAR"},{"id":"G","label":"Flight G","detail":"5 km|90%|CLEAR"},{"id":"H","label":"Flight H","detail":"6 km|95%|CLEAR"}],"id":"crosswind-3","ms":{"title":"Mampukah ia pergi dan pulang?","brief":"Kelajuan ialah 2 km/min. Bateri susut 10 mata peratusan seminit. Setiap misi melibatkan perjalanan pergi balik dan 2 minit berlegar. Sekurang-kurangnya 20% bateri mesti berbaki; cuaca mestilah CLEAR (cerah).","task":"Jarak yang disenaraikan ialah SEHALA. Pilih semua penerbangan dengan bateri mencukupi dan cuaca yang dibenarkan.","solution":"Masa penerbangan ialah jarak+2 minit, jadi bateri awal yang diperlukan ialah 10×jarak+40. A,C,D,G memenuhinya dan mempunyai cuaca CLEAR.","hints":["Ambil kira perjalanan pulang sebelum menggunakan kelajuan.","Bateri simpanan mesti kekal selepas penerbangan dan berlegar; ia tidak boleh digunakan."],"tag":"Pengiraan misi"}},{"type":"order","title":"Different height references","tag":"Coordinate reconstruction","brief":"Each beacon reports its height ABOVE its own base. Base heights are relative to ground.","task":"Arrange the beacons from lowest to highest TRUE altitude above ground.","answer":["d","c","b","a"],"solution":"True altitudes: A=9+4=13, B=−6+18=12, C=3+8=11, D=−2+11=9 m. Order D,C,B,A.","hints":["The displayed beacon heights do not share the same zero point.","Combine a beacon’s base height with its height above that base."],"items":[{"id":"a","label":"Beacon A","detail":"Base +9 m · beacon +4 m"},{"id":"d","label":"Beacon D","detail":"Base −2 m · beacon +11 m"},{"id":"b","label":"Beacon B","detail":"Base −6 m · beacon +18 m"},{"id":"c","label":"Beacon C","detail":"Base +3 m · beacon +8 m"}],"id":"crosswind-4","ms":{"title":"Rujukan ketinggian berbeza","brief":"Setiap suar melaporkan ketinggian DI ATAS tapaknya sendiri. Ketinggian tapak diukur relatif kepada tanah.","task":"Susun suar daripada paling rendah hingga paling tinggi mengikut altitud SEBENAR di atas tanah.","solution":"Altitud sebenar: A=9+4=13, B=−6+18=12, C=3+8=11, D=−2+11=9 m. Urutan D,C,B,A.","hints":["Ketinggian suar yang dipaparkan tidak berkongsi titik sifar yang sama.","Gabungkan ketinggian tapak suar dengan ketinggiannya di atas tapak itu."],"tag":"Menentukan koordinat sebenar"}},{"type":"text","title":"A pad with missing plans","tag":"Geometry","brief":"A convex polygon’s interior angles sum to 900°.","task":"How many sides does it have?","answer":"7","solution":"The interior-angle sum is (n−2)×180°. Therefore n−2=5 and n=7.","hints":["A convex n-sided polygon can be split into n−2 triangles from one vertex.","Each triangle contributes 180° to the interior-angle sum."],"input":"numeric","id":"crosswind-5","ms":{"title":"Pelan tapak yang hilang","brief":"Jumlah sudut pedalaman sebuah poligon cembung ialah 900°.","task":"Berapakah bilangan sisinya?","solution":"Jumlah sudut pedalaman ialah (n−2)×180°. Maka n−2=5 dan n=7.","hints":["Poligon cembung dengan n sisi boleh dibahagikan kepada n−2 segi tiga dari satu bucu.","Setiap segi tiga menyumbang 180° kepada jumlah sudut pedalaman."],"tag":"Geometri"}}],"edition":"Harder","ms":{"name":"Operasi Crosswind","tagline":"Laluan di bumbung. Pandangan berubah. Jangan hilang arah.","briefing":"Sebuah dron di bumbung boleh membawa maklumat perisikan terakhir keluar dari bandar. Sahkan laluan penerbangan dan rekod penghantarannya."},"overview":{"en":"Plan a rooftop route, navigate a maze and check drone flight records.","ms":"Rancang laluan bumbung, lalui labirin dan semak rekod penerbangan dron."}},{"id":"velvet-auction","number":8,"name":"Operation Velvet Auction","difficulty":"Harder","minutes":6,"accent":"#a44668","scene":"velvet","tagline":"Everyone has an invitation. Not everyone belongs here.","briefing":"A private auction is being used as cover for an intelligence exchange. Check the bids, catalogues and guest credentials.","defaultCode":"56819","puzzles":[{"type":"text","title":"What was the actual bid?","tag":"Reverse percentage","brief":"The invoice total is RM81.","task":"The auction adds a 10% buyer premium to the hammer bid, then a fixed RM4 fee. What was the hammer bid?","answer":"70","solution":"(81−4)/1.10=70. The premium was RM7 and the fixed fee RM4.","hints":["Undo the fixed fee separately from the percentage premium.","The premium is a percentage of the hammer bid, not of the final invoice."],"input":"numeric","id":"velvet-auction-1","ms":{"title":"Berapakah bidaan sebenarnya?","brief":"Jumlah invois ialah RM81.","task":"Lelongan menambah premium pembeli 10% pada harga ketukan tukul, kemudian fi tetap RM4. Berapakah harga ketukan tukul itu?","solution":"(81−4)/1.10=70. Premiumnya RM7 dan fi tetapnya RM4.","hints":["Batalkan fi tetap secara berasingan daripada premium peratusan.","Premium ialah peratusan harga ketukan tukul, bukan jumlah invois akhir."],"tag":"Peratusan songsang"}},{"type":"text","title":"The heavier token","tag":"Weighing riddle","brief":"Exactly one of nine identical-looking tokens is heavier than the others.","task":"Using a two-pan balance and no reference weights, what is the MINIMUM number of weighings that guarantees finding it?","answer":"2","solution":"Divide into three groups of three. Weigh two groups to identify the heavy group; then weigh one of its tokens against another. Two weighings suffice, and one has only three outcomes, too few for nine possibilities.","hints":["A balance gives three possible outcomes, including a tie.","Try dividing the candidates into three equal groups."],"input":"numeric","id":"velvet-auction-2","ms":{"title":"Token yang lebih berat","brief":"Tepat satu daripada sembilan token yang kelihatan sama adalah lebih berat daripada yang lain.","task":"Dengan neraca dua piring dan tanpa pemberat rujukan, berapakah bilangan penimbangan MINIMUM yang menjamin token itu dapat ditemukan?","solution":"Bahagikan kepada tiga kumpulan bertiga. Timbang dua kumpulan untuk menentukan kumpulan berat; kemudian timbang satu token kumpulan itu melawan satu lagi. Dua penimbangan mencukupi. Satu penimbangan hanya ada tiga hasil, tidak cukup untuk sembilan kemungkinan.","hints":["Neraca memberikan tiga hasil yang mungkin, termasuk seimbang.","Cuba bahagikan calon kepada tiga kumpulan sama besar."],"tag":"Teka-teki penimbangan"}},{"type":"pairs","title":"The catalogue’s hidden pricing","tag":"Word-value inference","brief":"Each vowel has one fixed value and each consonant another. A word’s lot number is the sum of its letter values.","task":"Infer the values from the log and connect each item to its lot.","answer":{"vault":"l12","silver":"l14","obsidian":"l20"},"solution":"MINT gives v+3c=9; ROSE gives 2v+2c=10. Hence vowels=3, consonants=2. VAULT=12, SILVER=14, OBSIDIAN=20.","hints":["Count vowel and consonant contributions separately in each calibration word.","The two word totals form two equations for the same two unknown values."],"evidence":[{"kind":"table","label":"Catalogue tests","headers":["Word","Lot"],"rows":[["MINT","9"],["ROSE","10"]]}],"left":[{"id":"vault","label":"VAULT","detail":""},{"id":"silver","label":"SILVER","detail":""},{"id":"obsidian","label":"OBSIDIAN","detail":""}],"right":[{"id":"l20","label":"Lot 20","detail":""},{"id":"l12","label":"Lot 12","detail":""},{"id":"l14","label":"Lot 14","detail":""}],"id":"velvet-auction-3","ms":{"title":"Nilai tersembunyi dalam katalog","brief":"Setiap vokal mempunyai satu nilai tetap dan setiap konsonan satu nilai tetap yang lain. Nombor lot sesuatu perkataan ialah jumlah nilai hurufnya.","task":"Tentukan nilai daripada log dan padankan setiap item dengan lotnya. Gunakan perkataan Inggeris yang dipaparkan.","solution":"MINT memberikan v+3c=9; ROSE memberikan 2v+2c=10. Maka vokal=3, konsonan=2. VAULT=12, SILVER=14, OBSIDIAN=20.","hints":["Kira sumbangan vokal dan konsonan secara berasingan bagi setiap perkataan penentukuran.","Dua jumlah perkataan membentuk dua persamaan bagi dua nilai tidak diketahui yang sama."],"tag":"Mengenal pasti nilai perkataan"}},{"type":"select","title":"The invitation checksum","tag":"Forensic audit","brief":"A genuine serial is V-abcd, where d is the last digit of a+2b+3c. The seal must be GOLD and the event day 18.","task":"Select every FORGED invitation.","answer":["B","C","E","F","G"],"solution":"A,D,H are genuine. B/G have bad check digits, C the wrong seal, E the wrong prefix, and F the wrong day.","hints":["You are selecting records that fail any rule, not those that pass all rules.","The final serial digit is a weighted check, not part of the weighted payload."],"columns":["Serial","Seal","Event day"],"records":[{"id":"A","label":"Invite A","detail":"V-2044|GOLD|18"},{"id":"B","label":"Invite B","detail":"V-3183|GOLD|18"},{"id":"C","label":"Invite C","detail":"V-5725|SILVER|18"},{"id":"D","label":"Invite D","detail":"V-0084|GOLD|18"},{"id":"E","label":"Invite E","detail":"X-1467|GOLD|18"},{"id":"F","label":"Invite F","detail":"V-4915|GOLD|19"},{"id":"G","label":"Invite G","detail":"V-7237|GOLD|18"},{"id":"H","label":"Invite H","detail":"V-6302|GOLD|18"}],"id":"velvet-auction-4","ms":{"title":"Jumlah semak jemputan","brief":"Siri tulen ialah V-abcd, dengan d sebagai digit terakhir a+2b+3c. Meterainya mesti GOLD (emas) dan hari acara 18.","task":"Pilih semua jemputan PALSU.","solution":"A,D,H adalah tulen. B/G mempunyai digit semak salah, C meterai salah, E awalan salah dan F hari salah.","hints":["Anda memilih rekod yang gagal mana-mana syarat, bukan yang lulus semuanya.","Digit terakhir siri ialah nilai semak berwajaran; ia tidak termasuk dalam data yang diwajarkan."],"tag":"Semakan forensik"}},{"type":"order","title":"The seller’s real return","tag":"Fractions and fees","brief":"The reserve price is RM96. Each offer is a fraction of that price, less the listed seller fee.","task":"Order the offers by NET proceeds to the seller, smallest first.","answer":["d","b","c","a"],"solution":"Net proceeds: A=72−5=67, B=80−18=62, C=84−20=64, D=64−3=61. Order D,B,C,A.","hints":["The largest fraction need not produce the largest net return.","Calculate the offer amount before deducting its own fee."],"items":[{"id":"a","label":"Offer A","detail":"3/4 of reserve · fee RM5"},{"id":"c","label":"Offer C","detail":"7/8 of reserve · fee RM20"},{"id":"b","label":"Offer B","detail":"5/6 of reserve · fee RM18"},{"id":"d","label":"Offer D","detail":"2/3 of reserve · fee RM3"}],"id":"velvet-auction-5","ms":{"title":"Pulangan sebenar penjual","brief":"Harga rizab ialah RM96. Setiap tawaran ialah pecahan harga itu, ditolak fi penjual yang disenaraikan.","task":"Susun tawaran mengikut hasil BERSIH kepada penjual, daripada paling kecil.","solution":"Hasil bersih: A=72−5=67, B=80−18=62, C=84−20=64, D=64−3=61. Urutan D,B,C,A.","hints":["Pecahan terbesar tidak semestinya memberikan pulangan bersih terbesar.","Kira jumlah tawaran sebelum menolak finya sendiri."],"tag":"Pecahan dan fi"}}],"edition":"Harder","ms":{"name":"Operasi Velvet Auction","tagline":"Semua orang ada jemputan. Bukan semuanya patut berada di sini.","briefing":"Sebuah lelongan persendirian dijadikan penyamaran untuk pertukaran maklumat perisikan. Semak bidaan, katalog dan kelayakan tetamu."},"overview":{"en":"Calculate bids, uncover catalogue codes and identify forged invitations.","ms":"Kira bidaan, bongkar kod katalog dan kenal pasti jemputan palsu."}},{"id":"ghost-frequency","number":9,"name":"Operation Ghost Frequency","difficulty":"Expert","minutes":8,"accent":"#37734d","scene":"terminal","tagline":"When the signal vanishes, follow the logic.","briefing":"A dormant relay has restarted with a new access protocol. Its logic gates, rail cipher and micro-lock each hide part of the final code.","defaultCode":"24307","puzzles":[{"type":"text","title":"Four switches, one setting","tag":"Boolean deduction","brief":"Switches A,B,C,D are recorded left to right. ON=1 and OFF=0.","task":"A and B differ. A and C match. D is OFF. Exactly two switches are ON. Enter the four-bit setting.","answer":"1010","solution":"If A were OFF, only B could be ON, contradicting the total of two. Thus A=C=ON, B=D=OFF: 1010.","hints":["Test the two possible states of A and propagate their consequences.","The total number of ON switches eliminates one entire case."],"input":"numeric","id":"ghost-frequency-1","ms":{"title":"Empat suis, satu tetapan","brief":"Suis A,B,C,D direkodkan dari kiri ke kanan. ON=1 dan OFF=0.","task":"A dan B berbeza. A dan C sama. D ialah OFF. Tepat dua suis ialah ON. Masukkan tetapan empat bit itu.","solution":"Jika A ialah OFF, hanya B boleh ON, bercanggah dengan jumlah dua. Maka A=C=ON, B=D=OFF: 1010.","hints":["Uji kedua-dua kemungkinan keadaan A dan ikuti kesannya.","Jumlah suis ON menyingkirkan satu keseluruhan kemungkinan."],"tag":"Deduksi Boolean"}},{"type":"text","title":"The columnar intercept","tag":"Transposition","brief":"The transmitter configuration and emitted stream were recovered.","task":"Recover the original command. Spaces in your response are optional.","answer":"WATCHTHEDOOR","solution":"Put ATO under key 1, CER under key 2, WHD under key 3 and THO under key 4. In physical column order 3,1,4,2, read rows: WATC / HTHE / DOOR → WATCH THE DOOR.","hints":["The emitted column order is not the physical left-to-right order.","The twelve letters divide into four columns of equal height."],"evidence":[{"kind":"lines","label":"Transmitter configuration","lines":["Width: 4 columns. Load plaintext left-to-right across rows.","Physical column keys, left-to-right: 3 · 1 · 4 · 2.","Emit columns from top to bottom in ascending key order."]},{"kind":"code","label":"Emitted stream","value":"ATOCERWHDTHO"}],"id":"ghost-frequency-2","ms":{"title":"Mesej lajur yang dipintas","brief":"Tetapan pemancar dan aliran yang dihantar telah ditemukan.","task":"Dapatkan arahan asal dalam bahasa Inggeris. Ruang dalam jawapan adalah pilihan.","solution":"Letak ATO di bawah kunci 1, CER di bawah kunci 2, WHD di bawah kunci 3 dan THO di bawah kunci 4. Mengikut urutan lajur fizikal 3,1,4,2, baca baris: WATC / HTHE / DOOR → WATCH THE DOOR.","hints":["Urutan lajur yang dihantar berbeza daripada urutan fizikal kiri ke kanan.","Dua belas huruf dibahagikan kepada empat lajur yang sama tinggi."],"tag":"Transposisi"},"answerNote":{"en":"Use the original English letters or code tokens shown in the evidence.","ms":"Gunakan huruf Inggeris asal atau token kod yang dipaparkan dalam bukti."}},{"type":"memory","title":"Odd channel, even channel","tag":"Transformed signal","brief":"Two interleaved receiver channels must be separated.","task":"Send the ODD-numbered flashes in their original order, then the EVEN-numbered flashes. Watch the signal, then enter your response.","answer":[3,4,4,2,1,2,1],"solution":"Original signal: 3 → 1 → 4 → 2 → 4 → 1 → 2. Required response: 3 → 4 → 4 → 2 → 1 → 2 → 1.","hints":["The requested response is a transformation of the flashes, not necessarily a direct copy.","Write the flash positions mentally, then apply the response rule. Replay is available."],"steps":[3,1,4,2,4,1,2],"id":"ghost-frequency-3","ms":{"title":"Saluran ganjil, saluran genap","brief":"Dua saluran penerima yang berselang-seli perlu dipisahkan.","task":"Hantar kelipan pada kedudukan GANJIL mengikut urutan asalnya, kemudian kelipan pada kedudukan GENAP. Perhatikan isyarat, kemudian masukkan balasan anda.","solution":"Isyarat asal: 3 → 1 → 4 → 2 → 4 → 1 → 2. Balasan yang diperlukan: 3 → 4 → 4 → 2 → 1 → 2 → 1.","hints":["Balasan yang diminta ialah perubahan pada urutan kelipan, bukan semestinya salinan terus.","Ingat kedudukan kelipan, kemudian gunakan peraturan balasan. Anda boleh menonton semula."],"tag":"Isyarat yang diubah"}},{"type":"dials","title":"The nonlinear relay","tag":"Constraint solving","brief":"All settings are whole digits 0–9.","task":"Set A+B+C=15 and A×B−C=29, with A>B>C.","answer":[8,4,3],"solution":"Substituting C=15−A−B gives (A+1)(B+1)=45. Within the digit range and A>B>C, only A=8, B=4, C=3 works.","hints":["Use the sum equation to eliminate C.","Look for factor pairs after bringing the remaining expression into product form."],"labels":["Channel A","Channel B","Channel C"],"id":"ghost-frequency-4","ms":{"title":"Geganti bukan linear","brief":"Semua tetapan ialah digit bulat 0–9.","task":"Tetapkan A+B+C=15 dan A×B−C=29, dengan A>B>C.","solution":"Gantikan C=15−A−B untuk mendapatkan (A+1)(B+1)=45. Dalam julat digit dan dengan A>B>C, hanya A=8, B=4, C=3 memenuhi syarat.","hints":["Gunakan persamaan jumlah untuk menghapuskan C.","Cari pasangan faktor selepas menukar ungkapan yang tinggal kepada bentuk hasil darab."],"tag":"Penyelesaian kekangan"}},{"type":"text","title":"A four-digit micro-lock","tag":"Exact deduction","brief":"This module’s separate FOUR-digit lock uses four different digits. Every test row gives EXACT counts.","task":"Recover the four-digit lock. “Wrong place” counts digits that exist in the lock but occupy another position.","answer":"8642","solution":"The unique solution is 8642. It matches all three rows: 6720→0/2; 8249→2/1; 4681→1/2. This unlocks one digit of the main five-digit code.","hints":["Count all present digits as correct-place plus wrong-place, without double-counting a digit.","Compare which digits can occur across the overlapping tests before deciding their positions."],"input":"numeric","evidence":[{"kind":"table","label":"Lock test log","headers":["Guess","Correct place","Wrong place"],"rows":[["6720","0","2"],["8249","2","1"],["4681","1","2"]]}],"id":"ghost-frequency-5","ms":{"title":"Kunci mini empat digit","brief":"Kunci EMPAT digit berasingan dalam modul ini menggunakan empat digit berlainan. Setiap baris ujian memberikan kiraan TEPAT.","task":"Dapatkan kod kunci empat digit itu. “Kedudukan salah” mengira digit yang wujud dalam kunci tetapi berada di kedudukan lain.","solution":"Satu-satunya penyelesaian ialah 8642. Ia sepadan dengan ketiga-tiga baris: 6720→0/2; 8249→2/1; 4681→1/2. Ini membuka satu digit kod utama lima digit.","hints":["Jumlah digit yang wujud ialah kedudukan betul ditambah kedudukan salah, tanpa mengira digit yang sama dua kali.","Bandingkan digit yang boleh wujud merentasi ujian yang bertindih sebelum menentukan kedudukannya."],"tag":"Deduksi tepat"}}],"edition":"Harder","ms":{"name":"Operasi Ghost Frequency","tagline":"Apabila isyarat hilang, ikuti logiknya.","briefing":"Sebuah geganti yang lama tidak aktif telah hidup semula dengan protokol akses baharu. Get logik, sifer lajur dan kunci mininya menyembunyikan bahagian kod akhir."},"overview":{"en":"Solve advanced logic, decode a transmission, transform signals and crack a mini-lock.","ms":"Selesaikan logik lanjutan, nyahsulit transmisi, ubah isyarat dan buka kunci mini."}},{"id":"last-light","number":10,"name":"Operation Last Light","difficulty":"Expert","minutes":8,"accent":"#99701a","scene":"finale","tagline":"Five final checks before the last light goes out.","briefing":"A final case waits at the end of the training network. Combine deductions, route-finding and data integrity to finish the trial.","defaultCode":"06429","puzzles":[{"type":"text","title":"One truth among four","tag":"Logic riddle","brief":"A document is in exactly one of crates A,B,C,D. Exactly ONE placard is true.","task":"Which crate contains the document? Enter its letter.","answer":"B","solution":"Only location B gives one true placard: A=true, B=false, C=false, D=false. Any other location makes two placards true.","hints":["A statement about a crate need not refer to the crate displaying it.","Test each possible location and count truths across all four placards."],"evidence":[{"kind":"table","label":"Placards","headers":["Crate","Statement"],"rows":[["A","The document is in B or C."],["B","The document is NOT in B."],["C","The document is in A."],["D","The document is in D."]]}],"id":"last-light-1","ms":{"title":"Satu kebenaran antara empat","brief":"Dokumen berada di dalam tepat satu peti A,B,C,D. Tepat SATU papan kenyataan adalah benar.","task":"Peti manakah yang mengandungi dokumen itu? Masukkan hurufnya.","solution":"Hanya lokasi B memberikan satu pernyataan benar: A=benar, B=palsu, C=palsu, D=palsu. Setiap lokasi lain menjadikan dua pernyataan benar.","hints":["Pernyataan tentang peti tidak semestinya merujuk kepada peti yang memaparkannya.","Uji setiap lokasi yang mungkin dan kira pernyataan benar pada keempat-empat papan."],"tag":"Teka-teki logik"},"answerNote":{"en":"Use the original English letters or code tokens shown in the evidence.","ms":"Gunakan huruf Inggeris asal atau token kod yang dipaparkan dalam bukti."}},{"type":"maze","title":"Final ordered retrieval","tag":"Route planning","brief":"All three caches must be recovered before the exit can release.","task":"Collect A → B → C in that order, then reach EXIT within 94 moves. Crossing a later marker does not collect it early. Resetting clears this route, not your other modules.","answer":["S","S","E","E","E","E","S","S","E","E","N","N","N","N","E","E","S","S","S","S","S","S","S","S","W","W","W","W","N","N","W","W","S","S","W","W","N","N","N","N","E","E","W","W","S","S","S","S","E","E","N","N","E","E","E","E","W","W","S","S","E","E","E","E","N","N","N","N","N","N","N","N","W","W","W","W","W","W","E","E","E","E","E","E","S","S","S","S","S","S","S","S"],"solution":"The shortest valid route is 92 moves. One valid route: S, S, E, E, E, E, S, S, E, E, N, N, N, N, E, E, S, S, S, S, S, S, S, S, W, W, W, W, N, N, W, W, S, S, W, W, N, N, N, N, E, E, W, W, S, S, S, S, E, E, N, N, E, E, E, E, W, W, S, S, E, E, E, E, N, N, N, N, N, N, N, N, W, W, W, W, W, W, E, E, E, E, E, E, S, S, S, S, S, S, S, S. N=up, E=right, S=down, W=left.","hints":["Plan the entire ordered trip, including any necessary return from a dead end.","A shortest valid route uses 'use strict';
const app = document.getElementById('app');
const STORE_KEY = 'akafaraz-field-trials-booth-v4';
const ADMIN_PIN = '476105';
const freshState = () => ({version:4,settings:{propCode:''},assignment:null,run:null});
let storageWorks = true;
function loadState(){
  try {
    const x = JSON.parse(localStorage.getItem(STORE_KEY));
    if(x?.version===4 && x.settings && (!x.assignment || MISSIONS.some(m=>m.id===x.assignment.missionId))){
      if(x.assignment?.status==='waiting' && !x.run) return x;
      if(x.assignment && x.run?.missionId===x.assignment.missionId && Array.isArray(x.run.modules) && x.run.modules.length===5) return x;
      if(!x.assignment && !x.run) return x;
    }
  } catch { storageWorks=false; }
  return freshState();
}
let store=loadState(), hostUnlocked=false, memoryToken=0, memoryPlaying=false;
let view=store.run ? (store.run.endedAt?'complete':store.run.expired?'expired':store.run.screen||'play') : 'home';
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch{storageWorks=false;}}
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
function norm(x){return String(x??'').normalize('NFKD').replace(/[−–]/g,'-').toUpperCase().replace(/[^A-Z0-9-]/g,'');}
function B(en,ms){return `<span class="en" lang="en">${esc(en)}</span><span class="ms" lang="ms">${esc(ms)}</span>`;}
function L(en){return MS[en] && MS[en]!==en ? B(en,MS[en]) : esc(en);}
function P(p,key){return B(p[key],p.ms[key]);}
function fileLabel(m,language='en'){return `${language==='ms'?'Fail':'File'} ${m.number} – ${m.name.replace(/^Operation\s+/,'')}`;}
function fileTitle(m){return B(fileLabel(m),fileLabel(m,'ms'));}
function btn(en,ms,name,cls='secondary',extra=''){return `<button type="button" class="${cls}" data-action="${name}" ${extra}>${B(en,ms)}</button>`;}
function mission(){return MISSIONS.find(x=>x.id===store.assignment?.missionId);}
function session(){return store.run;}
function mod(){return session()?.modules[session().current];}
function currentPuzzle(){return mission()?.puzzles[session()?.current];}
function countSolved(s){return s.solved.filter(Boolean).length;}
function fmt(ms){const n=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function remaining(s){return Math.max(0,s.deadline-Date.now());}
function elapsed(s){return Math.max(0,(s.endedAt||Date.now())-s.startedAt);}
function cancellation(){memoryToken++;memoryPlaying=false;}
function active(s){return !!s && !s.endedAt && !s.expired && remaining(s)>0;}
function canPlay(){return active(session());}
function feedback(en,ms){return en ? B(en,ms) : '';}
function setFeedback(en,ms){mod().feedback=[en,ms];}
function closeDialog(id){const d=document.getElementById(id);if(d.open)d.close();d.innerHTML='';}
function openDialog(id,html){const d=document.getElementById(id);d.innerHTML=html;if(!d.open)d.showModal();}

function chooseRandom(){
  const n=MISSIONS.length;
  if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a);}while(a[0]>=limit);return MISSIONS[a[0]%n];}
  return MISSIONS[Math.floor(Math.random()*n)];
}
function assignMission(id,manual=false){
  if(manual&&!hostUnlocked)return;
  if(store.assignment && !(manual && store.assignment.status==='waiting' && !store.run)){showAssignment();return;}
  const m=MISSIONS.find(x=>x.id===id);if(!m)return;
  store.assignment={missionId:m.id,status:'waiting',assignedAt:Date.now(),method:manual?'host':'random'};
  store.run=null;hostUnlocked=false;persist();view='home';render(false);showAssignment();
}
function showAssignment(){

  const m=mission();
  openDialog('missionDialog',`<div class="dialog-head"><div><div class="eyebrow">${B('Your assigned mission','Misi yang ditetapkan untuk anda')}</div><h2>${fileTitle(m)}</h2></div><div class="assignment-art">${missionArt(m.scene)}</div></div><div class="dialog-body"><p>${B(m.overview.en,m.overview.ms)}</p><div class="assignment-time"><span>${B('Mission time','Masa misi')}</span><strong>${fmt(m.minutes*60000)}</strong></div><div class="waiting-label">${B('Wait for the host’s go-ahead.','Tunggu arahan petugas.')}</div><p class="start-note">${B('Press Start only when the host tells you to. Your countdown begins then.','Tekan Mula hanya apabila diarahkan oleh petugas. Kiraan detik anda bermula selepas itu.')}</p>${btn('Start','Mula','start-mission','primary start-mission')}<div class="assignment-back">${btn('Back to briefing','Kembali ke taklimat','close-assignment','text-btn')}</div></div>`);
}

function masterSettings(){return `<details class="master-settings"><summary>${B('Optional prop code','Kod peranti pilihan')}</summary><form id="masterSettingsForm" novalidate><div class="field"><label for="propCode">${B('Fixed five-digit prop code','Kod tetap peranti lima digit')}</label><input id="propCode" type="password" inputmode="numeric" maxlength="5" autocomplete="off" value="${esc(store.settings.propCode)}"><small>${B('Leave blank to use each mission’s default. Save before the player presses Start.','Biarkan kosong untuk menggunakan kod lalai setiap misi. Simpan sebelum pemain menekan Mula.')}</small></div><button type="submit" class="secondary">${B('Save code','Simpan kod')}</button></form></details>`;}

function savePropCode(code){

function evidence(p){return (p.evidence||[]).map(e=>`<section class="evidence"><div class="evidence-label">${L(e.label)}</div>${e.kind==='table'?`<div class="table-wrap"><table><thead><tr>${e.headers.map(x=>`<th scope="col">${L(x)}</th>`).join('')}</tr></thead><tbody>${e.rows.map(row=>`<tr>${row.map(x=>`<td>${L(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:e.kind==='code'?`<div class="code-text">${L(e.value)}</div>`:e.lines.map(x=>`<p>${L(x)}</p>`).join('')}</section>`).join('');}

  if(p.type==='dials')return `<div class="dials">${p.labels.map((label,i)=>`<div class="dial-row"><div class="dial-title"><label for="dial${i}">${L(label)}</label><output class="dial-value" id="dialValue${i}">${st.dials[i]}</output></div><div class="dial-controls"><button class="icon-btn" data-action="dial-step" data-dial="${i}" data-delta="-1" aria-label="Decrease / Kurangkan ${esc(label)}">−</button><input id="dial${i}" type="range" min="0" max="9" step="1" value="${st.dials[i]}" data-dial-input="${i}" aria-label="${esc(label)} / ${esc(MS[label])}"><button class="icon-btn" data-action="dial-step" data-dial="${i}" data-delta="1" aria-label="Increase / Tambah ${esc(label)}">+</button></div></div>`).join('')}</div><div class="actions">${btn('Lock channels','Kunci saluran','submit','primary')}</div>`;

function puzzleView(){const s=session(),p=currentPuzzle(),st=mod(),i=s.current;return `<article class="puzzle-card"><header class="puzzle-head"><div class="puzzle-meta"><span class="badge">${P(p,'tag')}</span><span class="mission-number">${B(`MODULE ${String(i+1).padStart(2,'0')} / 05`,`MODUL ${String(i+1).padStart(2,'0')} / 05`)}</span></div><h2>${P(p,'title')}</h2><p>${P(p,'brief')}</p></header><div class="puzzle-body"><p class="task">${P(p,'task')}</p>${evidence(p)}${s.solved[i]?`<section class="success-note" tabindex="-1"><div class="reward"><span class="reward-digit">${s.targetCode[i]}</span>${B(`Code digit ${i+1} recovered`,`Digit kod ${i+1} ditemukan`)}</div><h3>${B('Good work, Agent.','Syabas, Ejen.')}</h3><p>${P(p,'solution')}</p><div class="actions">${btn(countSolved(s)===5?'Open disarm panel':'Next module',countSolved(s)===5?'Buka panel nyahaktif':'Modul seterusnya','next','primary')}</div></section>`:`${engine(p,st)}<div class="feedback" id="feedback" role="status">${feedback(...st.feedback)}</div>${hints(p,st)}`}</div></article>`;}
