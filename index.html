function equal(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function isCorrect(p,value){
  if(p.type==='text')return [p.answer,...(p.aliases||[])].some(x=>norm(x)===norm(value));
  if(p.type==='select')return equal([...value].sort(),[...p.answer].sort());
  if(p.type==='pairs')return Object.entries(p.answer).every(([k,v])=>value[k]===v);
  return equal(value,p.answer);
}
function wrong(en='That does not fit every clue. Check your work and try again.',ms='Jawapan itu belum memenuhi semua petunjuk. Semak dan cuba lagi.'){
  session().mistakes++;mod().attempts++;setFeedback(en,ms);persist();render();
}
function solve(){const s=session(),i=s.current;if(!canPlay()||s.solved[i])return;s.solved[i]=true;mod().attempts++;mod().feedback=[];persist();render();document.querySelector('.success-note')?.focus({preventScroll:true});}
function submit(){
  if(!canPlay()||session().solved[session().current])return;
  const p=currentPuzzle(),st=mod();let a;
  if(p.type==='text'){a=st.answer;if(!a.trim()){setFeedback('Enter an answer first.','Masukkan jawapan dahulu.');render();return;}}
  if(p.type==='select'){a=st.selected;if(!a.length){setFeedback('Select at least one record first.','Pilih sekurang-kurangnya satu rekod dahulu.');render();return;}}
  if(p.type==='order')a=st.order;
  if(p.type==='pairs'){a=st.pairs;if(Object.keys(a).length<p.left.length){setFeedback('Connect every left-hand item before checking.','Padankan setiap item di kiri sebelum menyemak.');render();return;}}
  if(p.type==='dials')a=st.dials;
  if(isCorrect(p,a))solve();else wrong();
}
async function watch(){
  if(!canPlay()||memoryPlaying||session().solved[session().current])return;
  const p=currentPuzzle(),st=mod(),token=++memoryToken;memoryPlaying=true;st.entry=[];st.feedback=[];st.watched=false;persist();
  document.getElementById('watchButton').disabled=true;document.querySelectorAll('.memory-pad').forEach(b=>{b.disabled=true;b.classList.remove('flashing');});
  const status=document.getElementById('memoryStatus');status.innerHTML=B('Watch carefully…','Perhatikan dengan teliti…');
  const delay=ms=>new Promise(r=>setTimeout(r,ms));await delay(450);
  for(let i=0;i<p.steps.length;i++){
    if(token!==memoryToken||!canPlay())return;
    const b=document.querySelector(`[data-pad="${p.steps[i]}"]`);
    status.innerHTML=B(`Pulse ${i+1} of ${p.steps.length}: pad ${p.steps[i]}`,`Denyut ${i+1} daripada ${p.steps.length}: pad ${p.steps[i]}`);
    b.classList.add('flashing');await delay(480);if(token!==memoryToken)return;b.classList.remove('flashing');await delay(220);
  }
  if(token!==memoryToken||!canPlay())return;memoryPlaying=false;st.watched=true;persist();render();
}
function pad(n){
  if(!canPlay()||memoryPlaying||!mod().watched||session().solved[session().current])return;
  const st=mod(),p=currentPuzzle();st.entry.push(n);st.feedback=[];
  if(st.entry.length===p.steps.length){if(equal(st.entry,p.answer)){solve();return;}st.entry=[];wrong('The response did not match the mission rule. Replay it or try again.','Balasan tidak mengikut peraturan misi. Tonton semula atau cuba lagi.');return;}
  persist();render();
}
function moveMaze(direction){
  if(!canPlay()||session().solved[session().current])return;
  const p=currentPuzzle(),st=mod(),d={N:[-1,0],S:[1,0],E:[0,1],W:[0,-1]}[direction];if(!d)return;
  if(st.moves>=p.moveLimit){setFeedback('Movement allowance used. Reset the route and plan again.','Had langkah telah digunakan. Tetapkan semula laluan dan rancang lagi.');render();return;}
  const r=st.pos[0]+d[0],c=st.pos[1]+d[1];
  if(!p.grid[r]||!p.grid[r][c]||p.grid[r][c]==='#'){setFeedback('That square is a wall.','Petak itu ialah dinding.');render();return;}
  st.pos=[r,c];st.moves++;st.feedback=[];const cell=p.grid[r][c];
  if(cell===p.checkpoints[st.collected.length])st.collected.push(cell);
  else if(p.checkpoints.includes(cell)&&!st.collected.includes(cell))setFeedback('This intel must wait. The next required marker is '+p.checkpoints[st.collected.length]+'.','Maklumat ini perlu menunggu. Penanda seterusnya ialah '+p.checkpoints[st.collected.length]+'.');
  if(cell==='E'){if(st.collected.length===p.checkpoints.length){solve();return;}setFeedback('Collect all required intel in order before exiting.','Kumpulkan semua maklumat mengikut urutan sebelum keluar.');}
  if(st.moves===p.moveLimit)setFeedback('Movement allowance used. Reset if the route is unfinished.','Had langkah telah digunakan. Tetapkan semula jika laluan belum selesai.');
  persist();render();
}
function finish(){if(!canPlay()||countSolved(session())!==5)return;session().endedAt=Date.now();store.assignment.status='complete';persist();view='complete';render(false);}
function tick(){
  const s=session();if(!s||s.endedAt||s.expired)return;const r=remaining(s);
  document.querySelectorAll('[data-clock]').forEach(x=>{x.textContent=fmt(r);x.classList.toggle('urgent',r<60000);});
  if(r===0){s.expired=true;store.assignment.status='expired';persist();cancellation();hostUnlocked=false;closeDialog('adminDialog');view='expired';render(false);}
}
function setView(next){view=next;if(session())session().screen=next;persist();render(false);}
function dispatch(b){
  const a=b.dataset.action,s=session();
  if(a==='admin'){showAdmin();return;}
  if(a==='accept'){if(!store.assignment)assignMission(chooseRandom().id);else if(store.assignment.status==='waiting')showAssignment();else setView(session().endedAt?'complete':session().expired?'expired':session().screen||'play');return;}
  if(a==='start-mission'){startMission();return;}
  if(a==='close-assignment'){closeDialog('missionDialog');return;}
  if(a==='reset-attempt'){resetAttempt();return;}
  if(!canPlay())return;
  if(a==='module'){const i=Number(b.dataset.index);if(Number.isInteger(i)&&i>=0&&i<5){s.current=i;setView('play');}return;}
  if(a==='debrief'){if(countSolved(s)===5)setView('debrief');return;}
  if(a==='review'){setView('play');return;}
  if(a==='next'){if(countSolved(s)===5)setView('debrief');else{s.current=(s.current+1)%5;setView('play');}return;}
  if(a==='finish-prop'){finish();return;}
  if(s.solved[s.current])return;
  const st=mod();
  if(a==='submit'){submit();return;}
  if(a==='hint'){if(st.hints<2){st.hints++;s.hintsUsed++;persist();render();}return;}
  if(a==='move-order'){const i=Number(b.dataset.index),j=i+Number(b.dataset.delta);if(j>=0&&j<st.order.length){[st.order[i],st.order[j]]=[st.order[j],st.order[i]];st.feedback=[];persist();render();}return;}
  if(a==='pair-left'){st.selectedLeft=b.dataset.left;st.feedback=[];persist();render();return;}
  if(a==='pair-right'){if(!st.selectedLeft){setFeedback('Choose a left-hand item first.','Pilih item di kiri dahulu.');render();return;}const right=b.dataset.right;for(const key of Object.keys(st.pairs))if(st.pairs[key]===right)delete st.pairs[key];st.pairs[st.selectedLeft]=right;st.selectedLeft=null;st.feedback=[];persist();render();return;}
  if(a==='reset-pairs'){st.pairs={};st.selectedLeft=null;persist();render();return;}
  if(a==='watch'){watch();return;}
  if(a==='pad'){pad(Number(b.dataset.pad));return;}
  if(a==='clear-memory'){st.entry=[];st.feedback=[];persist();render();return;}
  if(a==='maze-move'){moveMaze(b.dataset.direction);return;}
  if(a==='reset-maze'){st.pos=[0,0];st.moves=0;st.collected=[];st.feedback=[];persist();render();return;}
  if(a==='dial-step'){const i=Number(b.dataset.dial);st.dials[i]=Math.max(0,Math.min(9,st.dials[i]+Number(b.dataset.delta)));persist();render();}
}
document.addEventListener('input',e=>{
  if(e.target.id==='puzzleAnswer'&&canPlay()){mod().answer=e.target.value;persist();}
  if(e.target.dataset.dialInput!==undefined&&canPlay()){const i=Number(e.target.dataset.dialInput);mod().dials[i]=Number(e.target.value);document.getElementById('dialValue'+i).textContent=e.target.value;persist();}
});
document.addEventListener('change',e=>{if(e.target.id==='manualMission')masterPreview();if(e.target.dataset.record&&canPlay()){const st=mod(),id=e.target.dataset.record;st.selected=e.target.checked?[...new Set([...st.selected,id])]:st.selected.filter(x=>x!==id);st.feedback=[];persist();}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(b&&!b.disabled){dispatch(b);return;}
  if(e.target.closest('[data-close-admin]')){hostUnlocked=false;closeDialog('adminDialog');}
});
document.addEventListener('submit',e=>{
  const id=e.target.id;
  if(!['answerForm','adminForm','manualForm','masterSettingsForm'].includes(id))return;
  e.preventDefault();
  if(id==='answerForm'){if(canPlay()){mod().answer=document.getElementById('puzzleAnswer').value;submit();}return;}
  if(id==='adminForm'){
    const pin=document.getElementById('adminPin'),correct=pin.value===ADMIN_PIN;pin.value='';
    if(!correct){document.getElementById('adminError').innerHTML=B('Incorrect PIN.','PIN salah.');return;}
    hostUnlocked=true;adminControls();return;
  }
  if(id==='masterSettingsForm'){
    if(savePropCode(document.getElementById('propCode').value.trim()))document.getElementById('masterError').innerHTML=B('Prop code saved.','Kod peranti disimpan.');
    return;
  }
  if(id==='manualForm'&&hostUnlocked){
    const chosen=document.getElementById('manualMission').value;
    if(!savePropCode(document.getElementById('propCode').value.trim()))return;
    closeDialog('adminDialog');assignMission(chosen,true);
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('#mazeGrid')&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&!document.querySelector('dialog[open]')){e.preventDefault();moveMaze({ArrowUp:'N',ArrowDown:'S',ArrowLeft:'W',ArrowRight:'E'}[e.key]);document.getElementById('mazeGrid')?.focus({preventScroll:true});}
});
document.getElementById('missionDialog').addEventListener('cancel',e=>e.preventDefault());
document.getElementById('adminDialog').addEventListener('cancel',()=>{hostUnlocked=false;closeDialog('adminDialog');});
window.addEventListener('pagehide',persist);
setInterval(tick,250);
render(false);
if(store.assignment?.status==='waiting')showAssignment();
</script></body></html>
